<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GSE01 · 월드 모니터링</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div><span class="eyebrow">GSE01 / WORLD OBSERVATORY</span><h1>월드 모니터링</h1><p>각 월드와 마을의 지금을 한눈에 확인하세요.</p></div><span id="connection" role="status">연결 중</span></header>
<main><section id="metrics" class="metrics" aria-label="전체 집계"></section>
<div class="toolbar"><h2>마을 · 지역 현황</h2><label>월드 <select id="world"><option value="">전체 월드</option></select></label><label>검색 <input id="search" placeholder="마을 또는 NPC 이름"></label></div>
<p class="hint">5초 동안 새 메시지가 없으면 수신 중단으로 표시합니다. 집계는 마지막으로 수신한 상태이며, 로드된 영역만 포함합니다.</p>
<p id="error" role="alert"></p><div id="villages" class="villages"></div>
<section class="panel"><h2>NPC 상태</h2><div class="scroll"><table><thead><tr><th>월드 / 지역</th><th>NPC</th><th>상태</th><th>위치 (X, Y)</th><th>수신 상태</th></tr></thead><tbody id="npcs"></tbody></table></div></section>
<footer>JSON snapshot v1 · 로컬 수신기 · <span id="updated">메시지 대기 중</span></footer></main></body></html>
